[package]
name = "masonry_print"
version.workspace = true # We mimic Xilem's version
description = "Printing and vector PDF export for Masonry: snapshots, paginated documents, tagged PDF, PDF/A and RTL text."
keywords = ["gui", "pdf", "print", "masonry", "rtl"]
categories = ["gui", "internationalization", "accessibility", "text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[features]
default = ["noto-fonts"]
# Bundle the Noto Naskh Arabic and Noto Nastaliq Urdu fonts (SIL OFL 1.1, about 1 MB).
noto-fonts = []
# Helpers for testing PDF output (text extraction, rasterization).
testing = ["dep:hayro", "dep:lopdf"]

[dependencies]
hayro = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
imaging_krilla = { workspace = true, features = ["raster-fallback", "svg"] }
masonry.workspace = true
tracing.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
imaging_vello_cpu.workspace = true
masonry_print = { path = ".", features = ["testing", "noto-fonts"] }
masonry = { workspace = true, features = ["testing"] }
masonry_testing.workspace = true

[lints]
workspace = true
